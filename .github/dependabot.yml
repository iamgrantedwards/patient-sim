version: 2
updates:
  - package-ecosystem: uv
    directory: /
    labels: ["type:task", "area:ci"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      development-tools:
        dependency-type: development
    # The experiment contract pins this SDK. Updates require an explicit design decision.
    ignore:
      - dependency-name: livekit-agents
      # LiveKit Agents 1.8.2 requires OpenAI >=2,<3. Review these together on SDK upgrade.
      # Compatible 2.x updates remain eligible; dependency audits still cover the lockfile.
      - dependency-name: openai
        versions: [">=3"]
  - package-ecosystem: github-actions
    directory: /
    labels: ["type:task", "area:ci"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    labels: ["type:task", "area:ci"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      ui-development-tools:
        dependency-type: development
