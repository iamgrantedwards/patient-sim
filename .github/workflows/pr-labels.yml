name: PR metadata

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  labels:
    name: PR labels
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate current pull-request labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Fetch current metadata: rerunning an old event must not restore a stale pass.
          gh api "repos/$GH_REPO/issues/$PR_NUMBER" --jq '[.labels[].name]' > "$RUNNER_TEMP/pr-labels.json"
          python3 scripts/check-pr-labels.py < "$RUNNER_TEMP/pr-labels.json"
