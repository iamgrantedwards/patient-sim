[project]
name = "patient-sim"
version = "0.1.0"
description = "A LiveKit voice agent that calls a healthcare voice AI as a patient, to find bugs in it."
requires-python = ">=3.12,<3.13"
dependencies = [
    "livekit-agents==1.8.2",
    "livekit-api",
    "python-dotenv",
    "openai",
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "hatchling>=1.32.3",
    "pip-audit>=2.10.1",
    "pyright>=1.1.414",
    "pytest",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers --disable-socket --allow-unix-socket"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# Explicit source contents keep credentials and collected calls out of build artifacts.
[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/scripts/verify.sh", "/scripts/check.sh", "/scripts/build.sh",
    "/scripts/check-pr-labels.py", "/scripts/install-ci-tools.py", "/scripts/ci-tools.json", "/pyproject.toml", "/uv.lock",
    "/README.md", "/ARCHITECTURE.md", "/AGENTS.md", "/docs", "/.env.example",
    "/package.json", "/package-lock.json", "/biome.json", "/playwright.config.js",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "scripts/*.py"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
precision = 1
# Baseline was 70%; lifecycle regression tests brought it above 93%.
fail_under = 90
