[project]
name = "patient-sim"
version = "0.1.0"
description = "A LiveKit voice agent that calls a healthcare voice AI as a patient, to find bugs in it."
requires-python = ">=3.12,<3.13"
dependencies = [
    "livekit-agents==1.8.2",
    "livekit-api",
    "python-dotenv",
    "openai",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# Explicit source contents keep credentials and collected calls out of build artifacts.
[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/scripts/verify.sh", "/pyproject.toml", "/uv.lock",
    "/README.md", "/ARCHITECTURE.md", "/AGENTS.md", "/docs", "/.env.example",
]
